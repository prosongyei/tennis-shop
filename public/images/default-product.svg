<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="limeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="160" fill="url(#glow)"/>

  <!-- Subtle Court Lines Pattern -->
  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <rect x="50" y="50" width="300" height="300" rx="16"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
  </g>

  <!-- Racket Head Left -->
  <g transform="translate(200, 175) rotate(-35) translate(-200, -175)" filter="url(#shadow)">
    <!-- Racket Frame -->
    <ellipse cx="200" cy="130" rx="52" ry="68" fill="none" stroke="url(#accent)" stroke-width="7"/>
    <!-- String Grid -->
    <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4">
      <line x1="165" y1="130" x2="235" y2="130"/>
      <line x1="170" y1="100" x2="230" y2="100"/>
      <line x1="170" y1="160" x2="230" y2="160"/>
      <line x1="180" y1="75" x2="220" y2="75"/>
      <line x1="180" y1="185" x2="220" y2="185"/>
      <line x1="185" y1="70" x2="185" y2="190"/>
      <line x1="200" y1="65" x2="200" y2="195"/>
      <line x1="215" y1="70" x2="215" y2="190"/>
    </g>
    <!-- Shaft -->
    <rect x="197" y="198" width="6" height="85" rx="3" fill="url(#accent)"/>
    <!-- T-Joint -->
    <path d="M194 198 L206 198 L203 208 L197 208 Z" fill="#38bdf8"/>
    <!-- Grip / Handle -->
    <rect x="195" y="275" width="10" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <line x1="195" y1="285" x2="205" y2="288" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="195" y1="295" x2="205" y2="298" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="195" y1="305" x2="205" y2="308" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Shuttlecock (Centered Foreground) -->
  <g transform="translate(200, 160)" filter="url(#shadow)">
    <!-- Feathers -->
    <path d="M-28 -42 L0 0 L28 -42 Z" fill="#e2e8f0" fill-opacity="0.15"/>
    <line x1="0" y1="0" x2="-26" y2="-40" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-16" y2="-44" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-6" y2="-46" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="-46" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="-44" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="26" y2="-40" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Feather Bands / Ribbon -->
    <path d="M-22 -26 Q0 -20 22 -26" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-15 -14 Q0 -10 15 -14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Feather Tips Curve -->
    <path d="M-26 -40 Q0 -48 26 -40" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cork Base -->
    <ellipse cx="0" cy="5" rx="14" ry="12" fill="url(#limeAccent)"/>
    <ellipse cx="0" cy="3" rx="13" ry="5" fill="#f8fafc" fill-opacity="0.3"/>
  </g>

  <!-- Badge / Branding -->
  <g transform="translate(200, 320)" text-anchor="middle">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="2">TOSLENGSEY</text>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">AUTHENTIC BADMINTON GEAR</text>
</svg>
